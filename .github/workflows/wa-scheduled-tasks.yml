name: WhatsApp scheduled tasks

# AMC expiry reminders (30/15/7 day), feedback requests, and the outbound
# failed-send retry pass — see supabase/functions/wa-scheduled-tasks. This
# stack has deliberately avoided pg_cron elsewhere (see
# resolve_purchase_quote_requests's resolve-on-view pattern in the
# migrations), so this workflow is the scheduling mechanism instead of a
# new Postgres extension: no new extension enabled, nothing to manage
# inside the database, and it lives next to the rest of this repo's CI.
#
# The actual pacing (daily by default) is now admin-configurable via
# settings.scheduled_tasks_interval_minutes — see
# 20260825160000_wa_scheduled_job_intervals.sql and
# _shared/wa-job-pacing.ts. This trigger stays tight/fixed on purpose (GH
# Actions can't read an interval from a database); the function itself
# decides whether enough time has actually passed to do real work.
#
# Uses CRON_SECRET, same repo secret as wa-milestone-dispatch.yml and the
# same Supabase project secret the function checks
# (Deno.env.get("CRON_SECRET")) — previously mismatched as WA_CRON_SECRET,
# which meant this workflow's first-ever scheduled run (2026-08-25) failed
# with 401 before doing any work. Fixed here; the CRON_SECRET repo secret
# itself still needs to be set to match the Supabase project's value.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # manual trigger, for testing without waiting for the schedule

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call wa-scheduled-tasks
        run: |
          curl --fail-with-body -sS -X POST \
            "https://fsunrjithwcjtsutsgea.supabase.co/functions/v1/wa-scheduled-tasks" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
